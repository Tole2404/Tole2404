<svg width="100%" height="100%" viewBox="0 0 880 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated Aurora Gradient -->
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#10b981;#a855f7;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#a855f7;#00f0ff;#10b981" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7000ff">
        <animate attributeName="stop-color" values="#7000ff;#00f0ff;#10b981;#7000ff" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glassmorphic Background -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1728" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040a14" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="aurora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.7)); }
    }
    .aurora-card {
      animation: pulseGlow 6s infinite ease-in-out;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Aurora Outer Glow Border -->
  <rect x="4" y="4" width="872" height="192" rx="16" fill="url(#card-bg)" stroke="url(#aurora-grad)" stroke-width="2" class="aurora-card"/>

  <!-- Developer Avatar Circle with Cyber Ring -->
  <g transform="translate(30, 28)">
    <circle cx="72" cy="72" r="62" fill="#040d1a" stroke="url(#aurora-grad)" stroke-width="3"/>
    <!-- Cyber Geometric Avatar Icon -->
    <circle cx="72" cy="54" r="22" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="2"/>
    <path d="M 36 108 C 36 86 52 78 72 78 C 92 78 108 86 108 108" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="72" cy="54" r="8" fill="#00f0ff"/>
    <!-- Online Badge -->
    <circle cx="120" cy="116" r="8" fill="#10b981" stroke="#040d1a" stroke-width="2"/>
  </g>

  <!-- Main Info Section -->
  <g transform="translate(190, 42)">
    <!-- Handle -->
    <text x="0" y="0" fill="#00f0ff" font-size="14" font-weight="700" class="font-mono" letter-spacing="1">
      @Tole2404
    </text>

    <!-- Full Name -->
    <text x="0" y="32" fill="#ffffff" font-size="28" font-weight="800" class="font-sans" letter-spacing="-0.5">
      Tunggul Bayu Kusuma
    </text>

    <!-- Bio / Role Subtitle -->
    <text x="0" y="60" fill="#94a3b8" font-size="13.5" font-weight="500" class="font-sans">
      Full-Stack &amp; Enterprise Architect  |  Founder of Enterprise ERP  |  IoT &amp; Systems Engineer
    </text>

    <!-- Interactive Pill Badges -->
    <g transform="translate(0, 80)">
      <!-- Badge 1: Golang -->
      <rect x="0" y="0" width="85" height="26" rx="13" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1"/>
      <text x="42.5" y="17" text-anchor="middle" fill="#00f0ff" font-size="11.5" font-weight="700" class="font-mono">Go (Golang)</text>

      <!-- Badge 2: Next.js -->
      <rect x="95" y="0" width="85" height="26" rx="13" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1"/>
      <text x="137.5" y="17" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700" class="font-mono">Next.js 15</text>

      <!-- Badge 3: TypeScript -->
      <rect x="190" y="0" width="105" height="26" rx="13" fill="#3178c6" fill-opacity="0.2" stroke="#3178c6" stroke-width="1"/>
      <text x="242.5" y="17" text-anchor="middle" fill="#60a5fa" font-size="11.5" font-weight="700" class="font-mono">TypeScript</text>

      <!-- Badge 4: PostgreSQL -->
      <rect x="305" y="0" width="100" height="26" rx="13" fill="#336791" fill-opacity="0.2" stroke="#336791" stroke-width="1"/>
      <text x="355" y="17" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700" class="font-mono">PostgreSQL</text>

      <!-- Badge 5: C++ & IoT -->
      <rect x="415" y="0" width="90" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="460" y="17" text-anchor="middle" fill="#34d399" font-size="11.5" font-weight="700" class="font-mono">C++ / IoT</text>
    </g>
  </g>

  <!-- Right Side Live Telemetry Stats Box -->
  <g transform="translate(730, 36)">
    <rect x="0" y="0" width="120" height="128" rx="10" fill="#040d1a" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="60" y="24" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="700" class="font-mono" letter-spacing="1">
      EXPERTISE
    </text>
    <text x="60" y="58" text-anchor="middle" fill="#00f0ff" font-size="28" font-weight="900" class="font-mono">
      PRO
    </text>
    <line x1="15" y1="72" x2="105" y2="72" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="60" y="92" text-anchor="middle" fill="#10b981" font-size="10.5" font-weight="700" class="font-mono">
      ENTERPRISE
    </text>
    <text x="60" y="110" text-anchor="middle" fill="#a855f7" font-size="9.5" font-weight="600" class="font-mono">
      SCALE-READY
    </text>
  </g>
</svg>
