<svg width="100%" height="100%" viewBox="0 0 880 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="cyber-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>

    <!-- Glowing Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091424" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateY(0px); opacity: 0.2; }
      20% { opacity: 1; }
      50% { transform: translateY(290px); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes borderPulse {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }
    .scan-laser {
      animation: laserSweep 4s infinite ease-in-out;
    }
    .status-pulse {
      animation: blink 1.8s infinite ease-in-out;
    }
    .terminal-border {
      animation: borderPulse 3s infinite ease-in-out;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', Courier, monospace;
    }
  </style>

  <!-- Outer HUD Frame -->
  <rect x="4" y="4" width="872" height="432" rx="14" fill="#030712" stroke="url(#neon-cyan)" stroke-width="1.5" class="terminal-border" filter="url(#glow)"/>
  <rect x="4" y="4" width="872" height="432" rx="14" fill="url(#cyber-grid)"/>

  <!-- Top Terminal Bar -->
  <rect x="5" y="5" width="870" height="36" rx="12" fill="#091322"/>
  <rect x="5" y="30" width="870" height="11" fill="#091322"/>
  <line x1="5" y1="41" x2="875" y2="41" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Window Controls -->
  <circle cx="24" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="23" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text x="440" y="27" text-anchor="middle" fill="#00f0ff" font-size="13" font-weight="700" letter-spacing="2" class="font-mono">
    TELEMETRY_TERMINAL :: TOLE2404 // PROFILE_SCANNER_v2.0
  </text>
  <circle cx="850" cy="23" r="4" fill="#00f0ff" class="status-pulse" filter="url(#glow)"/>

  <!-- LEFT PANEL: VISUAL.MAP -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="310" height="350" rx="8" fill="url(#panel-grad)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    
    <rect x="1" y="1" width="308" height="28" rx="7" fill="#09192f"/>
    <text x="12" y="19" fill="#00f0ff" font-size="11" font-weight="700" letter-spacing="1.5" class="font-mono">
      VISUAL.MAP :: [BIOMETRIC_SCAN]
    </text>
    <text x="298" y="19" text-anchor="end" fill="#10b981" font-size="10" font-weight="600" class="font-mono status-pulse">
      ● REC
    </text>
    <line x1="0" y1="29" x2="310" y2="29" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- ASCII Face Wireframe Art -->
    <g fill="#00f0ff" font-size="9.5" font-family="monospace" letter-spacing="1.2" opacity="0.85">
      <text x="155" y="52" text-anchor="middle">.::!JJYYJJ!::.</text>
      <text x="155" y="66" text-anchor="middle">:?5PGGGGGGGGP5?:</text>
      <text x="155" y="80" text-anchor="middle">^YGGGGGGGGGGGGGGGY^</text>
      <text x="155" y="94" text-anchor="middle">?GGGGGGGGGGGGGGGGGG?</text>
      <text x="155" y="108" text-anchor="middle">5GGGGGBBBBBBBGGGGG5</text>
      <text x="155" y="122" text-anchor="middle">GGGGGB#@@@@@#BGGGGG</text>
      <text x="155" y="136" text-anchor="middle">GGGG#[SCAN]##GGGG</text>
      <text x="155" y="150" text-anchor="middle">GGGG#@@@@@@@#GGGG</text>
      <text x="155" y="164" text-anchor="middle">5GGGGGBBBBBBBGGGGG5</text>
      <text x="155" y="178" text-anchor="middle">?GGGGGGGGGGGGGGGGGG?</text>
      <text x="155" y="192" text-anchor="middle">^YGGGGGGGGGGGGGGGY^</text>
      <text x="155" y="206" text-anchor="middle">:?5PGGGGGGGGP5?:</text>
      <text x="155" y="220" text-anchor="middle">.::!JJYYJJ!::.</text>
      <text x="155" y="240" text-anchor="middle">▲ TARGET: TUNGGUL_BAYU ▲</text>
      <text x="155" y="256" text-anchor="middle">STATUS: IDENTITY VERIFIED</text>
      <text x="155" y="272" text-anchor="middle">CYBER_ID: TOLE-2404-ENG</text>
      <text x="155" y="288" text-anchor="middle">GEO: [ID] - INDONESIA</text>
      <text x="155" y="304" text-anchor="middle">SYSTEMS: ALL GREEN [100%]</text>
    </g>

    <!-- Animated Laser Sweep Beam -->
    <g class="scan-laser">
      <rect x="2" y="30" width="306" height="4" fill="url(#laser-grad)"/>
      <line x1="2" y1="32" x2="308" y2="32" stroke="#00f0ff" stroke-width="1.8" filter="url(#glow)"/>
    </g>

    <path d="M 6 338 L 6 344 L 14 344" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M 304 338 L 304 344 L 296 344" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
  </g>

  <!-- RIGHT PANEL: SYSTEM.INFO -->
  <g transform="translate(352, 60)">
    <rect x="0" y="0" width="504" height="350" rx="8" fill="url(#panel-grad)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    
    <rect x="1" y="1" width="502" height="28" rx="7" fill="#09192f"/>
    <text x="14" y="19" fill="#00f0ff" font-size="11" font-weight="700" letter-spacing="1.5" class="font-mono">
      SYSTEM.INFO // NEURAL_SPECIFICATION
    </text>
    <text x="490" y="19" text-anchor="end" fill="#00f0ff" font-size="10" font-weight="600" class="font-mono">
      SYS_VER: 4.8.0-RELEASE
    </text>
    <line x1="0" y1="29" x2="504" y2="29" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3"/>

    <g class="font-mono" font-size="12">
      <!-- Subject -->
      <text x="16" y="56" fill="#8892b0" font-weight="600">SUBJECT</text>
      <text x="140" y="56" fill="#64ffda">:</text>
      <text x="160" y="56" fill="#ffffff" font-weight="700">Tunggul Bayu Kusuma</text>

      <!-- Handle -->
      <text x="16" y="82" fill="#8892b0" font-weight="600">HANDLE</text>
      <text x="140" y="82" fill="#64ffda">:</text>
      <text x="160" y="82" fill="#00f0ff" font-weight="700">@Tole2404</text>
      <text x="488" y="82" text-anchor="end" fill="#00f0ff" font-size="11">[DEV_NODE]</text>

      <!-- Role -->
      <text x="16" y="108" fill="#8892b0" font-weight="600">ROLE</text>
      <text x="140" y="108" fill="#64ffda">:</text>
      <text x="160" y="108" fill="#e2e8f0">Full-Stack &amp; Software Developer</text>

      <!-- Primary Stack -->
      <text x="16" y="134" fill="#8892b0" font-weight="600">LANGUAGES</text>
      <text x="140" y="134" fill="#64ffda">:</text>
      <text x="160" y="134" fill="#a78bfa" font-weight="600">PHP (Laravel/CI), Go, TypeScript, Next.js, Java</text>

      <!-- Storage -->
      <text x="16" y="160" fill="#8892b0" font-weight="600">STORAGE_OPS</text>
      <text x="140" y="160" fill="#64ffda">:</text>
      <text x="160" y="160" fill="#38bdf8">MySQL, PostgreSQL, Redis, Docker, Linux</text>

      <!-- Active Project -->
      <text x="16" y="186" fill="#8892b0" font-weight="600">ACTIVE_PROJECT</text>
      <text x="140" y="186" fill="#64ffda">:</text>
      <text x="160" y="186" fill="#f43f5e" font-weight="700">Enterprise Multi-Module ERP System</text>

      <!-- Web Services -->
      <text x="16" y="212" fill="#8892b0" font-weight="600">WEB_SERVICES</text>
      <text x="140" y="212" fill="#64ffda">:</text>
      <text x="160" y="212" fill="#34d399">RESTful APIs, MVC, JWT Auth, Microservices</text>

      <!-- Architecture -->
      <text x="16" y="238" fill="#8892b0" font-weight="600">ARCHITECTURE</text>
      <text x="140" y="238" fill="#64ffda">:</text>
      <text x="160" y="238" fill="#cbd5e1">Clean Architecture, Microservices, RBAC</text>

      <!-- Status -->
      <text x="16" y="264" fill="#8892b0" font-weight="600">STATUS</text>
      <text x="140" y="264" fill="#64ffda">:</text>
      <text x="160" y="264" fill="#10b981" font-weight="700">● OPEN FOR COLLABORATION &amp; LEARNING</text>
    </g>

    <!-- Console -->
    <rect x="14" y="284" width="476" height="52" rx="6" fill="#030816" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="24" y="304" fill="#00f0ff" font-size="10.5" font-family="monospace" class="status-pulse">
      $ git commit -m "feat: ship clean, robust application code"
    </text>
    <text x="24" y="322" fill="#10b981" font-size="10.5" font-family="monospace">
      [SUCCESS] All checks passed. Ready to deploy.
    </text>
  </g>
</svg>
